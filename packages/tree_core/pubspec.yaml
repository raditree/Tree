name: tree_core
description: Tree 桌面端核心（agent 编排 / LLM / 工具 / 存储 / 插件）；纯 Dart，不含 Flutter。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  tree_protocol:
    path: ../tree_protocol
  tree_local_exec:
    path: ../tree_local_exec
  # 以下两个是 Dart 官方包（纯 Dart、可 AOT），核心进程因此不再是"零依赖"。
  # 取舍见 lib/src/store/tree_paths.dart 与 yaml_codec.dart 的说明：
  # - path：跨平台路径拼接（Windows 盘符/分隔符由官方实现保证正确）
  # - yaml：配置文件要允许用户**手改**，必须接受任意合法 YAML（手写解析器不现实）
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
