name: tree_core_cli
description: Tree 桌面端核心进程的可执行入口（dart compile exe → tree_core.exe）。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  tree_core:
    path: ../tree_core
  # 集成测试直接断言进程间握手信封（CoreHandshake）
  tree_protocol:
    path: ../tree_protocol
  # 装配工作空间后端（本地 / SSH，含 dartssh2 传输）
  tree_local_exec:
    path: ../tree_local_exec

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
