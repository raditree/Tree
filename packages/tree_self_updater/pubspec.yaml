name: tree_self_updater
description: 框架自迭代插件（self_updater，binary 型内置插件）：把「热重启某个插件（含重启自己）」做成一个 agent tool，经执行站 plugin.* 命令转发给核心，让 agent 能自行换一世而不断会话。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  # 只借它的**帧编解码 + RPC 骨架**（行分隔 JSON-RPC、id 发生器、错误码）。
  # 刻意**不依赖** tree_core / tree_protocol / Flutter：插件包保持零核心依赖，
  # 协议方法名在本包里自带一张常量表（见 plugin_methods.dart，tree_protocol 的
  # 门禁用例把「插件侧自带常量表」登记为合法项）。
  tree_tunnel_protocol:
    path: ../tree_tunnel_protocol

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
