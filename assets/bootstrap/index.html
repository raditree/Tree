<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tree-bootstrap-build" content="3">
<title>Tree 插件管理</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0f1216;color:#e5e9f0;font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 12px}
.muted{color:#8b98a9;font-size:12.5px}
.card{background:#171c23;border:1px solid #262f3a;border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button{cursor:pointer;border:1px solid #33404f;background:#202832;color:#e5e9f0;border-radius:8px;padding:6px 11px;font:inherit}
button:hover{background:#28323e}
button.primary{background:#2563eb;border-color:#2563eb}
button.primary:hover{background:#1d4ed8}
button.danger{border-color:#7f1d1d;color:#fca5a5}
button:disabled{opacity:.45;cursor:not-allowed}
input{background:#0d1117;color:#e5e9f0;border:1px solid #33404f;border-radius:8px;padding:6px 9px;font:inherit}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #232c36;vertical-align:top}
th{color:#93a1b3;font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid #33404f;white-space:nowrap}
.badge.ok{color:#86efac;border-color:#14532d}
.badge.warn{color:#fcd34d;border-color:#713f12}
.badge.off{color:#9aa7b8}
.badge.ui{color:#93c5fd;border-color:#1e3a8a}
.banner{display:none;padding:10px 14px;border-radius:10px;margin-bottom:14px;border:1px solid}
.banner.error{display:block;color:#fecaca;background:#2a1215;border-color:#7f1d1d}
.banner.ok{display:block;color:#bbf7d0;background:#0f2417;border-color:#14532d}
.banner.info{color:#bfdbfe;background:#0c1b2e;border-color:#1e3a8a}
.notice{display:none;color:#fde68a;background:#241e0c;border:1px solid #713f12;border-radius:8px;padding:6px 10px;margin-top:8px;font-size:12.5px}
.hint{color:#8b98a9;font-size:12.5px;margin-top:6px}
.hint code{background:#0d1117;border-radius:4px;padding:0 4px}
.deps{margin-top:4px;font-size:12.5px;color:#9fb0c4}
.deps code{background:#0d1117;border-radius:4px;padding:0 4px}
.inline-empty{color:#8b98a9;padding:10px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #33404f;border-top-color:#93c5fd;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:10}
.dialog{background:#171c23;border:1px solid #2b3644;border-radius:12px;padding:18px;width:min(520px,100%)}
.dialog label{display:block;margin:10px 0 4px;font-size:12.5px;color:#93a1b3}
.dialog input{width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tree 插件管理</h1>
    <span class="muted">引导壳 · 仅插件管理</span>
    <span class="spacer"></span>
    <span id="tokenState" class="badge off">正在验证引导票据…</span>
  </header>

  <div id="errorBanner" class="banner error"></div>
  <div id="readyBanner" class="banner">界面已就绪，可关闭本页。</div>
  <div id="versionBanner" class="banner info"></div>

  <div class="card" id="authCard">
    <h2>引导链接</h2>
    <div id="authBody" class="muted"><span class="spin"></span>正在用票据换取会话 token…</div>
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">必需插件</h2>
      <span class="spacer"></span>
      <button id="installRequiredBtn" class="primary">补齐并安装</button>
    </div>
    <div class="hint">
      未安装 <code>tree.agent</code> 时，旧数据（agents / 模型 / 会话）无法解析，界面上的相关列表会是空的。
      安装来自发布仓库（Gitee 优先、GitHub 兜底）。
    </div>
    <div id="requiredBody" class="inline-empty"><span class="spin"></span>加载中…</div>
    <div id="requiredNotice" class="notice"></div>
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">已配置插件</h2>
      <span class="spacer"></span>
      <button id="reloadBtn">刷新</button>
    </div>
    <div id="pluginsBody" class="inline-empty"><span class="spin"></span>加载中…</div>
    <div id="pluginsNotice" class="notice"></div>
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">内置插件</h2>
      <span class="spacer"></span>
      <button id="reprobeBtn">重新探测运行时</button>
    </div>
    <div id="builtinsBody" class="inline-empty"><span class="spin"></span>加载中…</div>
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">发布仓库</h2>
      <span class="spacer"></span>
      <button id="refreshReleaseBtn">刷新索引</button>
    </div>
    <div id="releaseMeta" class="hint"></div>
    <div id="releaseBody" class="inline-empty"><span class="spin"></span>加载中…</div>
    <div id="releaseNotice" class="notice"></div>
  </div>
</div>

<div id="editMask" class="mask">
  <div class="dialog">
    <h2 id="editTitle">编辑插件</h2>
    <label>名称<input id="editName"></label>
    <label>描述<input id="editDescription"></label>
    <label>命令<input id="editCommand"></label>
    <label>参数（空格分隔）<input id="editArgs"></label>
    <div class="row" style="margin-top:14px">
      <span class="spacer"></span>
      <button id="editCancel">取消</button>
      <button id="editSave" class="primary">保存</button>
    </div>
    <div id="editError" class="hint"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // 核心在返回 HTML 时把这一处替换成一次性换会话票据（不写死主 token）。
  var BOOTSTRAP_TICKET = "__BOOTSTRAP_TICKET__";
  var token = '';
  var readyShown = false;
  var pollTimer = null;

  // 会话 token 生效时刻（判「401 是被吊销」还是「到期」用，见 showReady）。
  var sessionStartedAt = 0;

  // 会话 TTL 约 600s：**开页 5 分钟内就 401** 只可能是界面接管后核心吊销了它，
  // 不可能是到期 —— 只有这一档才敢让页面自关；否则用户干等 10 分钟后页面自己
  // 消失、界面却还没起来，就再没有可管理的入口了。
  var REVOKE_CLOSE_WINDOW_MS = 5 * 60 * 1000;

  // 发布索引条目（「必需插件」卡要从里面判断“装了没、有没有更新”）。
  var _releaseEntries = [];

  // 已配置清单条目（id → 配置；索引里缺那一条时的兜底判断用）。
  var _configById = {};

  // 「版本更新后引导清空」：用 cookie 记住上次打开本页时的核心版本。
  //
  // 为什么用 cookie 而不是 localStorage：核心每次启动的端口由内核分配（随机），
  // localStorage 按 `scheme://host:port` 隔离——换个端口就等于换了一份空存储，
  // 永远比不出“版本变了”。cookie 只按 host 隔离，跨端口还在。
  var COOKIE_VERSION = 'tree_bootstrap_version';
  var COOKIE_STATE_PREFIX = 'tree_bootstrap_state_';

  // 必需的领域插件的根（依赖从发布索引的 requires 里自动补齐）。
  var REQUIRED_ROOTS = ['tree.agent'];

  var $ = function (id) { return document.getElementById(id); };

  function readCookie(name) {
    var parts = document.cookie ? document.cookie.split(';') : [];
    for (var i = 0; i < parts.length; i++) {
      var pair = parts[i].trim();
      if (pair.indexOf(name + '=') === 0) {
        return decodeURIComponent(pair.slice(name.length + 1));
      }
    }
    return '';
  }

  function writeCookie(name, value) {
    document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=31536000; SameSite=Lax';
  }

  // 清掉本页自己留下的引导状态（版本变了就不再沿用上一版的任何提示状态）。
  function clearGuideState() {
    (document.cookie ? document.cookie.split(';') : []).forEach(function (pair) {
      var key = pair.split('=')[0].trim();
      if (key.indexOf(COOKIE_STATE_PREFIX) === 0) {
        document.cookie = key + '=; path=/; max-age=0; SameSite=Lax';
      }
    });
  }

  function showVersionBanner(message) {
    var banner = $('versionBanner');
    if (!message) { banner.style.display = 'none'; banner.textContent = ''; return; }
    banner.style.display = 'block';
    banner.textContent = message;
  }

  function isSessionExpired(error) {
    return !!error && (error.status === 401 || error.status === 403);
  }

  // 会话失效**不是出错**：界面一起来，引导票据本就作废。统一走这一句，
  // 免得把「已经就绪」渲染成一条红色错误横幅（实机上的红条基本都来自这里）。
  //
  // `autoClose = false`：这一档分不清「界面接管后被吊销」还是「单纯到期」，
  // 宁可只留一句“可关闭本页”，也不把一个界面还没起来的页面自己关掉。
  function noteSessionExpired() {
    showError('');
    $('tokenState').className = 'badge off';
    $('tokenState').textContent = '会话已失效';
    showReady(false);
  }

  // 版本签名三要素（见 versionSignature）。
  var _coreVersion = '';
  var _apiVersion = '';
  var _releaseTag = '';

  // 对比版本签名；变了就重置引导状态并提示一句。
  //
  // 只读 `/api/meta` 与 `/api/plugin/release`（引导会话 token 允许访问的路径），
  // 不额外要权限。
  async function loadMeta() {
    var meta = await api('/api/meta');
    _coreVersion = (meta && meta.core_version) || '';
    _apiVersion = (meta && meta.api_version) || '';
    return meta;
  }

  // 版本签名 = 核心版本 + 协议版本 + 发布索引的 release tag。
  //
  // 为什么不是只比 `core_version`：核心那边是**协议版本**（长期不变，
  // 发新装机包也不会动），真正随发版变化的是发布索引的 tag（v1.0.5 → v1.0.6）。
  function versionSignature() {
    if (!_coreVersion) return '';
    return [_coreVersion, _apiVersion, _releaseTag].join('|');
  }

  function applyVersionCheck() {
    var version = versionSignature();
    if (!version) return;
    var previous = readCookie(COOKIE_VERSION);
    if (!previous) { writeCookie(COOKIE_VERSION, version); return; }
    if (previous === version) return;
    clearGuideState();
    writeCookie(COOKIE_VERSION, version);
    showVersionBanner('版本已更新，引导已重置。');
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showError(message) {
    var banner = $('errorBanner');
    if (!message) { banner.className = 'banner error'; banner.textContent = ''; return; }
    banner.className = 'banner error';
    banner.textContent = message;
  }

  function setNotice(id, message) {
    var node = $(id);
    if (!message) { node.style.display = 'none'; node.textContent = ''; return; }
    node.style.display = 'block';
    node.textContent = message;
  }

  // 界面接管后引导页没有继续存在的理由：先试着自关。
  //
  // 浏览器只允许“脚本开的窗口”被脚本关掉（本页通常由启动器用 `start` 打开），
  // 所以自关经常失败：失败就**留着横幅**，让用户看到“可以关了”自己点 X。
  // 不弹确认框、也不假装自己关了。
  function showReady(autoClose) {
    if (readyShown) return;
    readyShown = true;
    var banner = $('readyBanner');
    banner.classList.remove('error');
    banner.classList.add('ok');
    if (autoClose === false) return;
    try { window.close(); } catch (e) { /* 关不掉：横幅留着 */ }
  }

  async function api(path, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (options.body) headers['Content-Type'] = 'application/json';
    var response = await fetch(path, {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
      cache: 'no-store'
    });
    var text = await response.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
    if (!response.ok) {
      var detail = data && (data.detail || data.message) ? (data.detail || data.message) : text;
      var error = new Error(detail || ('HTTP ' + response.status));
      error.status = response.status;
      throw error;
    }
    return data;
  }

  async function exchangeTicket() {
    if (BOOTSTRAP_TICKET.indexOf('__BOOTSTRAP') === 0) {
      $('authBody').innerHTML = '本页没有拿到引导票据（可能直接打开了内置最小页面）。请从启动器菜单重新打开。';
      return;
    }
    try {
      var data = await fetch('/api/bootstrap/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticket: BOOTSTRAP_TICKET }),
        cache: 'no-store'
      }).then(async function (response) {
        var text = await response.text();
        var parsed = null;
        try { parsed = text ? JSON.parse(text) : null; } catch (_) {}
        if (!response.ok) {
          var detail = parsed && parsed.detail ? parsed.detail : text;
          throw new Error(detail || ('HTTP ' + response.status));
        }
        return parsed;
      });
      token = data.token || '';
      sessionStartedAt = Date.now();
      $('authBody').innerHTML = '票据已兑换为会话 token（有效期约 ' + esc(data.expires_in || 600) +
        ' 秒）。界面就绪后本页会自动失效。';
      $('tokenState').className = 'badge ok';
      $('tokenState').textContent = '会话已授权';
      $('authCard').style.display = 'none';
      showError('');
      try {
        await loadMeta();
      } catch (error) {
        if (isSessionExpired(error)) {
          noteSessionExpired();
        } else {
          showError('读取 /api/meta 失败：' + error.message);
        }
      }
      await loadAll();
      startMetaPolling();
    } catch (error) {
      $('tokenState').className = 'badge warn';
      $('tokenState').textContent = '引导链接不可用';
      $('authBody').innerHTML = '票据兑换失败：' + esc(error.message) +
        '<div class="hint">请在启动器菜单里重新签发引导票据，再打开新的链接。</div>';
      showError('引导票据已失效：' + error.message);
    }
  }

  function statusBadge(plugin) {
    var status = plugin.status || '';
    var health = plugin.health || '';
    var lifecycle = plugin.lifecycle || '';
    if (status === 'registered' && health !== 'degraded') {
      return '<span class="badge ok">运行中</span>';
    }
    if (lifecycle === 'restarting') return '<span class="badge warn">重启中</span>';
    if (health === 'degraded') return '<span class="badge warn">降级</span>';
    if (status === 'disabled') return '<span class="badge off">已停用</span>';
    return '<span class="badge off">' + esc(status || '未知') + '</span>';
  }

  function runtimeBadge(plugin) {
    var runtime = plugin.runtime || '';
    if (runtime === 'ui') return '<span class="badge ui">ui</span>';
    return '<span class="badge">' + esc(runtime || '未声明') + '</span>';
  }

  function dependencyRows(requires) {
    if (!requires) return '';
    var plugins = requires.plugins || requires || [];
    if (!plugins.length) return '';
    var items = plugins.map(function (dep) {
      var id = dep.plugin_id || dep.id || dep;
      var version = dep.version || dep.min_version || '';
      return '<code>' + esc(id) + (version ? ' @ ' + esc(version) : '') + '</code>';
    });
    return '<div class="deps">依赖：' + items.join('、') + '</div>';
  }

  async function loadPlugins() {
    var body = $('pluginsBody');
    try {
      var snapshot = await api('/api/plugin/snapshot');
      var instances = (snapshot && snapshot.instances) || [];
      var configs = (snapshot && snapshot.config && snapshot.config.plugins) || [];
      var byId = {};
      instances.forEach(function (item) { byId[item.plugin_id] = item; });
      var ids = {};
      configs.forEach(function (config) { ids[config.id] = true; });
      instances.forEach(function (item) { ids[item.plugin_id] = true; });
      _configById = {};
      configs.forEach(function (config) { _configById[config.id] = config; });
      var list = Object.keys(ids).sort().map(function (id) {
        var config = null;
        configs.forEach(function (item) { if (item.id === id) config = item; });
        var instance = byId[id] || {};
        return { id: id, config: config || {}, instance: instance };
      });
      if (!list.length) {
        body.className = 'inline-empty';
        body.textContent = '还没有配置任何插件。可在下方「发布仓库」安装，或在上方「内置插件」启用。';
        return;
      }
      body.className = '';
      var releaseById = {};
      _releaseEntries.forEach(function (item) { releaseById[item.plugin_id] = item; });
      var html = '<table><thead><tr><th>插件</th><th>runtime / 源</th><th>状态</th><th>操作</th></tr></thead><tbody>';
      list.forEach(function (row) {
        var config = row.config || {};
        var instance = row.instance || {};
        var name = instance.name || config.name || row.id;
        var version = config.version || instance.version || '';
        var source = config.builtin ? '内置' : (config.release || config.source || '自定义');
        var enabled = config.enabled !== false;
        // 只有声明了 suspension: keep 才会真“续上”；否则核心按冷启动（D3）。
        var canSuspend = (config.suspension || '') === 'keep';
        var releaseEntry = releaseById[row.id] || null;
        var actions = [];
        // 仓库里有更新：先把「更新」摆出来（带依赖，免得升完还起不来）。
        if (releaseEntry && releaseEntry.has_update === true) {
          actions.push('<button class="primary" data-act="install-deps" data-id="' + esc(row.id) + '">更新</button>');
        }
        // 启用 / 停用：**显式按钮**。停用态给「启用」——只摆一个复选框时，用户
        // 看到「已停用」会以为这一条没法操作了（实机反馈过）。
        // 停用态也不摆「热重启」：热重启会把插件拉起来，按钮本身就该说清这件事，
        // 而不是让用户点了才发现开关被顺手打开了。
        if (enabled) {
          actions.push('<button data-act="hot-restart" data-id="' + esc(row.id) + '">' +
            (canSuspend ? '热重启（保留状态）' : '重启（冷启动）') + '</button>');
          actions.push('<button class="danger" data-act="disable" data-id="' + esc(row.id) + '">停用</button>');
        } else {
          actions.push('<button class="primary" data-act="enable" data-id="' + esc(row.id) + '">启用</button>');
        }
        actions.push('<button data-act="edit" data-id="' + esc(row.id) + '">编辑</button>');
        actions.push('<button class="danger" data-act="uninstall" data-id="' + esc(row.id) + '">卸载</button>');
        html += '<tr>' +
          '<td><strong>' + esc(name) + '</strong><div class="muted">' + esc(row.id) +
            (version ? ' · v' + esc(version) : '') + '</div>' + dependencyRows(config.requires || instance.requires) + '</td>' +
          '<td>' + runtimeBadge(instance) + '<div class="muted">' + esc(source) + '</div></td>' +
          '<td>' + statusBadge(instance) + (instance.disabled_reason ?
            '<div class="muted">' + esc(instance.disabled_reason) + '</div>' : '') + '</td>' +
          '<td><div class="row">' + actions.join('') + '</div></td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      body.innerHTML = html;
      setNotice('pluginsNotice', '');
    } catch (error) {
      body.className = 'inline-empty';
      if (isSessionExpired(error)) {
        noteSessionExpired();
        body.textContent = '界面已就绪，本页会话已失效（可关闭本页）。';
      } else {
        body.textContent = '插件列表加载失败：' + error.message;
      }
    }
  }

  async function loadBuiltins(refresh) {
    var body = $('builtinsBody');
    try {
      var data = await api('/api/plugin/builtins' + (refresh ? '?refresh=1' : ''));
      var builtins = (data && data.builtins) || [];
      if (!builtins.length) {
        body.className = 'inline-empty';
        body.textContent = '没有内置插件。';
        return;
      }
      body.className = '';
      var html = '<table><thead><tr><th>插件</th><th>运行时</th><th>状态</th><th>操作</th></tr></thead><tbody>';
      builtins.forEach(function (item) {
        var resolution = item.resolution || {};
        var ready = resolution.ready !== false && resolution.ok !== false;
        var reason = resolution.reason || resolution.error || '';
        var actions = [];
        if (item.enabled) {
          actions.push('<button class="danger" data-act="builtin-disable" data-id="' + esc(item.id) + '">停用</button>');
        } else {
          actions.push('<button class="primary" data-act="builtin-enable" data-id="' + esc(item.id) + '">启用</button>');
        }
        html += '<tr>' +
          '<td><strong>' + esc(item.name || item.id) + '</strong><div class="muted">' + esc(item.id) +
            (item.version ? ' · v' + esc(item.version) : '') + '</div>' +
            dependencyRows(item.requires) + '</td>' +
          '<td>' + esc((item.runtime || resolution.runtime || '') || '未声明') + '</td>' +
          '<td>' + (ready ? '<span class="badge ok">可用</span>' : '<span class="badge warn">不可用</span>') +
            (reason ? '<div class="muted">' + esc(reason) + '</div>' : '') + '</td>' +
          '<td><div class="row">' + actions.join('') + '</div></td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      body.innerHTML = html;
    } catch (error) {
      body.className = 'inline-empty';
      if (isSessionExpired(error)) {
        noteSessionExpired();
        body.textContent = '界面已就绪，本页会话已失效（可关闭本页）。';
      } else {
        body.textContent = '内置插件加载失败：' + error.message;
      }
    }
  }

  async function loadRelease() {
    var body = $('releaseBody');
    try {
      var data = await api('/api/plugin/release');
      var entries = (data && data.entries) || [];
      _releaseEntries = entries;
      _releaseTag = (data && data.tag) || '';
      var meta = [];
      if (data && data.source) meta.push('源：' + data.source);
      if (data && data.tag) meta.push('release：' + data.tag);
      if (data && data.online) meta.push('联网');
      if (data && !data.ok && data.error) meta.push('错误：' + data.error);
      $('releaseMeta').textContent = meta.join(' · ');
      if (!entries.length) {
        body.className = 'inline-empty';
        body.textContent = (data && data.ok === false)
          ? ('发布索引不可用：' + (data.error || '未知原因'))
          : '本地还没有发布索引缓存，点「刷新索引」联网拉取。';
        return;
      }
      body.className = '';
      var html = '<table><thead><tr><th>插件</th><th>版本</th><th>依赖</th><th>操作</th></tr></thead><tbody>';
      entries.forEach(function (item) {
        var installed = item.installed_version || '';
        var hasUpdate = item.has_update === true;
        var deps = item.requires && item.requires.plugins ? item.requires.plugins : [];
        var actions = [];
        // 未装：两条路都留着 —— 「安装」连依赖一起补，「最小安装」只落它自己；
        // 内网 / 想自己控制装哪些依赖的人不该被"自动"绑架。
        if (!installed) {
          actions.push('<button class="primary" data-act="install" data-id="' + esc(item.plugin_id) + '">安装</button>');
          actions.push('<button data-act="install-minimal" data-id="' + esc(item.plugin_id) + '">最小安装</button>');
        } else if (hasUpdate) {
          actions.push('<button class="primary" data-act="install-deps" data-id="' + esc(item.plugin_id) + '">更新</button>');
        } else {
          actions.push('<span class="badge ok">已是最新</span>');
        }
        if (deps.length) {
          actions.push('<button data-act="install-deps-only" data-id="' + esc(item.plugin_id) + '">安装依赖</button>');
        }
        html += '<tr>' +
          '<td><strong>' + esc(item.name || item.plugin_id) + '</strong><div class="muted">' + esc(item.plugin_id) +
            (item.description ? ' · ' + esc(item.description) : '') + '</div></td>' +
          '<td>' + esc(item.version || '') +
            (installed ? '<div class="muted">本机 v' + esc(installed) + '</div>' : '') + '</td>' +
          '<td>' + (deps.length ? dependencyRows(item.requires) : '<span class="muted">无</span>') + '</td>' +
          '<td><div class="row">' + actions.join('') + '</div></td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      if (data && data.skipped && data.skipped.length) {
        html += '<div class="hint">已跳过：' + data.skipped.map(esc).join('；') + '</div>';
      }
      body.innerHTML = html;
      setNotice('releaseNotice', '');
    } catch (error) {
      body.className = 'inline-empty';
      if (isSessionExpired(error)) {
        noteSessionExpired();
        body.textContent = '界面已就绪，本页会话已失效（可关闭本页）。';
      } else {
        body.textContent = '发布索引加载失败：' + error.message;
      }
    }
  }

  // 一组插件 + 它们在发布索引里声明的依赖（闭包），顺序按「先根、后依赖」。
  function closureOf(roots) {
    var byId = {};
    _releaseEntries.forEach(function (item) { byId[item.plugin_id] = item; });
    var rows = [];
    var seen = {};
    var queue = (roots || []).slice();
    while (queue.length) {
      var id = queue.shift();
      if (!id || seen[id]) continue;
      seen[id] = true;
      var entry = byId[id] || null;
      rows.push({ id: id, entry: entry, root: (roots || []).indexOf(id) >= 0 });
      var deps = entry && entry.requires && entry.requires.plugins ? entry.requires.plugins : [];
      deps.forEach(function (dep) { queue.push(dep.id || dep.plugin_id || ''); });
    }
    return rows;
  }

  function requiredClosure() {
    return closureOf(REQUIRED_ROOTS);
  }

  function isMissing(row) {
    if (row.entry && row.entry.installed_version) return false;
    return !_configById[row.id];
  }

  async function loadRequirements() {
    var body = $('requiredBody');
    var rows = requiredClosure();
    if (!rows.length) {
      body.className = 'inline-empty';
      body.textContent = '本地还没有发布索引缓存，无法判断必需插件是否已安装。点下方「刷新索引」联网拉取。';
      return;
    }
    var missing = [];
    var html = '<table><thead><tr><th>插件</th><th>说明</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    rows.forEach(function (row) {
      var entry = row.entry || {};
      var config = _configById[row.id];
      var installedVersion = entry.installed_version || (config ? (config.version || '') : '');
      var missingNow = isMissing(row);
      if (missingNow) missing.push(row.id);
      var kind = row.root ? '必需' : '依赖';
      var state = missingNow
        ? '<span class="badge warn">未安装</span>'
        : '<span class="badge ok">已安装' + (installedVersion ? ' v' + esc(installedVersion) : '') + '</span>';
      var action = missingNow
        ? ('<button class="primary" data-act="required-install" data-id="' + esc(row.id) + '">安装</button>')
        : '';
      html += '<tr>' +
        '<td><strong>' + esc(entry.name || row.id) + '</strong><div class="muted">' + esc(row.id) + '</div></td>' +
        '<td>' + kind + '</td>' +
        '<td>' + state + (!entry.plugin_id ? '<div class="muted">发布索引里没有这一条</div>' : '') + '</td>' +
        '<td><div class="row">' + action + '</div></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    body.className = '';
    body.innerHTML = html;
    if (missing.length) {
      setNotice('requiredNotice', '缺少：' + missing.join('、') + '。未装 tree.agent 时旧数据（agents / 模型 / 会话）无法解析，相关列表会是空的。');
    } else {
      setNotice('requiredNotice', '');
    }
  }

  async function runAction(button, task, successMessage) {
    if (button) button.disabled = true;
    showError('');
    try {
      await task();
      if (successMessage) setNotice('pluginsNotice', successMessage);
      await loadAll();
    } catch (error) {
      if (isSessionExpired(error)) {
        noteSessionExpired();
      } else {
        showError(error.message);
      }
    } finally {
      if (button) button.disabled = false;
    }
  }

  function post(path, body) {
    return api(path, { method: 'POST', body: body || {} });
  }

  // ── 编辑弹窗（引导页没有插件面板那套编辑器，这里只放"改完能立刻生效"的四个字段）──
  var _editingId = '';

  function openEditor(id) {
    var config = _configById[id] || {};
    _editingId = id;
    $('editTitle').textContent = '编辑插件 · ' + id;
    $('editName').value = (config.name || '').toString();
    $('editDescription').value = (config.description || '').toString();
    $('editCommand').value = (config.command || '').toString();
    $('editArgs').value = (config.args || []).join(' ');
    $('editError').textContent = '';
    $('editMask').style.display = 'flex';
  }

  function closeEditor() {
    $('editMask').style.display = 'none';
    _editingId = '';
  }

  function saveEditor() {
    var id = _editingId;
    if (!id) return;
    var body = {
      name: $('editName').value.trim(),
      description: $('editDescription').value.trim(),
      command: $('editCommand').value.trim(),
      args: $('editArgs').value.split(/\s+/).filter(function (part) { return part.length > 0; })
    };
    $('editSave').disabled = true;
    api('/api/plugin/configs/' + encodeURIComponent(id), { method: 'PATCH', body: body })
      .then(function (data) {
        closeEditor();
        // 核心给的 notice（「配置已保存，但本次热应用失败…」）必须原样显示。
        setNotice('pluginsNotice', (data && data.notice) ? data.notice : ('已保存：' + id));
        return loadAll();
      })
      .catch(function (error) {
        $('editError').textContent = isSessionExpired(error) ? '会话已失效，请重新打开引导页。' : error.message;
        if (isSessionExpired(error)) noteSessionExpired();
      })
      .finally(function () {
        $('editSave').disabled = false;
      });
  }

  // 「安装依赖」：只装这条插件声明里缺的依赖，不动目标本身。
  function installOnlyDependencies(button, id) {
    var rows = closureOf([id]);
    var missing = rows.filter(function (row) { return row.id !== id && isMissing(row); });
    if (!missing.length) {
      setNotice('releaseNotice', '依赖都已安装：' + id);
      return;
    }
    button.disabled = true;
    setNotice('releaseNotice', '正在安装依赖：' + missing.map(function (row) { return row.id; }).join('、'));
    var chain = Promise.resolve();
    missing.forEach(function (row) {
      chain = chain.then(function () {
        return post('/api/plugin/release/' + encodeURIComponent(row.id) + '/install', {
          with_dependencies: true
        });
      });
    });
    chain.then(function () {
      setNotice('releaseNotice', '依赖安装请求已完成：' + id);
      return loadAll();
    }).catch(function (error) {
      if (isSessionExpired(error)) {
        noteSessionExpired();
      } else {
        setNotice('releaseNotice', '安装依赖失败：' + id + '（' + error.message + '）');
      }
    }).finally(function () {
      button.disabled = false;
    });
  }

  function bindActions() {
    document.addEventListener('click', function (event) {
      var button = event.target.closest('button[data-act]');
      if (!button) return;
      var id = button.getAttribute('data-id');
      var act = button.getAttribute('data-act');
      var releaseNotice = '';
      if (act === 'hot-restart') {
        runAction(button, function () {
          return post('/api/plugin/configs/' + encodeURIComponent(id) + '/restart', {
            mode: 'hot', keep_state: true
          });
        }, '已热重启：' + id);
      } else if (act === 'edit') {
        openEditor(id);
      } else if (act === 'install-minimal' || act === 'install-deps-only') {
        if (act === 'install-minimal') {
          releaseNotice = '正在最小安装：' + id;
          setNotice('releaseNotice', releaseNotice);
          runAction(button, function () {
            return post('/api/plugin/release/' + encodeURIComponent(id) + '/install', {
              with_dependencies: false
            });
          }, '安装请求完成：' + id);
        } else {
          installOnlyDependencies(button, id);
        }
      } else if (act === 'disable') {
        runAction(button, function () {
          return api('/api/plugin/configs/' + encodeURIComponent(id), {
            method: 'PATCH', body: { enabled: false }
          });
        }, '已停用：' + id);
      } else if (act === 'enable') {
        runAction(button, function () {
          return api('/api/plugin/configs/' + encodeURIComponent(id), {
            method: 'PATCH', body: { enabled: true }
          });
        }, '已启用：' + id);
      } else if (act === 'uninstall') {
        if (!window.confirm('卸载插件 ' + id + '？（会停用并删除插件文件，配置条目保留）')) return;
        runAction(button, function () {
          return post('/api/plugin/release/' + encodeURIComponent(id) + '/uninstall');
        }, '已卸载：' + id);
      } else if (act === 'builtin-enable') {
        runAction(button, function () {
          return post('/api/plugin/builtins/' + encodeURIComponent(id) + '/enable');
        }, '已启用内置插件：' + id);
      } else if (act === 'builtin-disable') {
        runAction(button, function () {
          return post('/api/plugin/builtins/' + encodeURIComponent(id) + '/disable');
        }, '已停用内置插件：' + id);
      } else if (act === 'install' || act === 'install-deps') {
        // 「安装」= 连依赖一起补（用户口径里的「安装（带依赖）」）。
        releaseNotice = '正在安装（含依赖）：' + id;
        setNotice('releaseNotice', releaseNotice);
        runAction(button, function () {
          return post('/api/plugin/release/' + encodeURIComponent(id) + '/install', {
            with_dependencies: true
          });
        }, '安装请求完成：' + id);
      } else if (act === 'required-install') {
        button.disabled = true;
        setNotice('requiredNotice', '正在安装：' + id);
        post('/api/plugin/release/' + encodeURIComponent(id) + '/install', {
          with_dependencies: true
        }).then(function () {
          setNotice('requiredNotice', '安装请求完成：' + id);
          return loadAll();
        }).catch(function (error) {
          setNotice('requiredNotice', '安装失败：' + id + '（' + error.message + '）');
        }).finally(function () {
          button.disabled = false;
        });
      }
    });

    $('editCancel').addEventListener('click', closeEditor);
    $('editSave').addEventListener('click', saveEditor);
    $('editMask').addEventListener('click', function (event) {
      if (event.target === $('editMask')) closeEditor();
    });

    $('reloadBtn').addEventListener('click', loadAll);

    // 「补齐并安装」：把必需插件闭包里缺的每一条都装一遍（带依赖，让核心自己
    // 按 requires 的顺序落盘）。
    $('installRequiredBtn').addEventListener('click', function () {
      var button = $('installRequiredBtn');
      var rows = requiredClosure();
      if (!rows.length) {
        setNotice('requiredNotice', '本地还没有发布索引缓存，先点下方「刷新索引」联网拉取。');
        return;
      }
      var missing = rows.filter(isMissing);
      if (!missing.length) {
        setNotice('requiredNotice', '必需插件都已安装。');
        return;
      }
      button.disabled = true;
      setNotice('requiredNotice', '正在安装：' + missing.map(function (row) { return row.id; }).join('、'));
      var chain = Promise.resolve();
      missing.forEach(function (row) {
        chain = chain.then(function () {
          return post('/api/plugin/release/' + encodeURIComponent(row.id) + '/install', {
            with_dependencies: true
          });
        });
      });
      chain.then(function () {
        setNotice('requiredNotice', '安装请求已完成。');
        return loadAll();
      }).catch(function (error) {
        setNotice('requiredNotice', '安装失败：' + error.message);
      }).finally(function () {
        button.disabled = false;
      });
    });
    $('reprobeBtn').addEventListener('click', function () {
      var button = $('reprobeBtn');
      button.disabled = true;
      loadBuiltins(true).finally(function () { button.disabled = false; });
    });
    $('refreshReleaseBtn').addEventListener('click', function () {
      var button = $('refreshReleaseBtn');
      button.disabled = true;
      setNotice('releaseNotice', '正在联网刷新发布索引…');
      post('/api/plugin/release/refresh').then(function (data) {
        if (data && data.ok === false) {
          setNotice('releaseNotice', '刷新失败：' + (data.error || '未知原因'));
        } else {
          setNotice('releaseNotice', '发布索引已刷新。');
        }
      }).catch(function (error) {
        setNotice('releaseNotice', '刷新失败：' + error.message);
      }).finally(function () {
        button.disabled = false;
        loadAll();
      });
    });
  }

  async function loadAll() {
    if (!token) return;
    // 先拉发布索引：「必需插件」卡要用它的 installed_version 判断装没装。
    await loadRelease();
    await Promise.all([loadPlugins(), loadBuiltins(false)]);
    await loadRequirements();
    // 版本签名要等发布索引（tag）拿到之后再比，所以放在最后。
    applyVersionCheck();
  }

  function startMetaPolling() {
    if (pollTimer) return;
    var tick = async function () {
      try {
        var meta = await api('/api/meta');
        var ui = (meta && meta.ui) || [];
        if (ui.length) {
          showReady(true);
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          // 会话 token 在首个 ui.hello 后会被核心吊销：这正是“界面就绪”的信号。
          // 但到期也是 401 —— 只有“开页不久就 401”才算界面接管（见常量注释）。
          showReady(
            sessionStartedAt > 0 &&
              Date.now() - sessionStartedAt < REVOKE_CLOSE_WINDOW_MS
          );
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      }
    };
    tick();
    pollTimer = setInterval(tick, 3000);
  }

  bindActions();
  exchangeTicket();
})();
</script>
</body>
</html>
