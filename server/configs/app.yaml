server:
  host: "0.0.0.0"
  port: 8000

# CORS 跨域配置。
# allow_origins 为空列表表示不放开任意源（默认，安全推荐）；
# 需要 Web 端跨域访问时，把允许的源列出来（如 ["http://localhost:3000"]）并置 allow_credentials: true。
# 注意：allow_credentials 为 true 时不允许出现 "*"，任意源带凭据是不安全组合。
cors:
  allow_origins: []
  allow_credentials: false

# 提示词体系多版本选择（见 server/prompt/versions.py；版本内容在 server/prompt/versions/ 下）
prompt:
  version: "1.0.0"

# 用户可创建的顶层 agent 数量上限
agents:
  max_per_user: 5
  # 团队最大层级深度（顶部 agent 为 Level 0）
  max_level: 2

docker:
  image: "agent-workspace:latest"
  # 每个 agent 可指挥的成员数量上限
  max_members_per_level: 7
  resource_limits:
    cpu: "4.0"
    memory: "4g"
    disk: "10g"

# 文件上传限制
upload:
  # 单个文件大小上限
  max_file_size: "300m"
  # 沙箱内全部文件总大小上限（上传前校验，避免单 agent 工作空间膨胀）
  sandbox_max_size: "8g"

# LLM 调用行为（应用级默认值）
llm:
  # 单次调用超时（秒）。长上下文 + thinking 模型响应可能很慢，
  # 但必须设上限，否则 API 挂起会导致前端永远显示 working（表现为卡死）
  timeout_seconds: 300
  # 调用失败重试次数
  max_retries: 1
  # 主动延迟限流（帧率控制式固定时间步节奏）：见 llm/rate_limit.py
  # 平均每 API 调用次数 / 分钟（限制上游调用频率，默认 6）
  rate_per_minute: 6
  # 最小调用间隔（秒），0 时自动按 60/rate_per_minute 推导（默认 10s）
  min_interval_seconds: 0

# SFT 数据收集与导出
data_export:
  # 每日自动导出时刻（HH:MM，本地时区；默认 1:43）
  daily_time: "01:43"
  # 允许下载/查看 SFT 导出文件的管理员 openid 列表
  # （导出文件含全量对话，仅管理员可访问，防止普通用户越权拉取）
  admin_openids: []

# 沙箱网络与下载限制（checklist 13/14）
sandbox:
  network:
    # 是否启用白名单式出站网络限制（启用后容器自动获得 NET_ADMIN 以配置 iptables）
    enabled: true
    # 白名单：仅允许访问以下主机（域名或 IP；默认放行回环、DNS 与已建立连接）
    whitelist:
      - "pypi.org"
      - "files.pythonhosted.org"
      - "github.com"
      - "raw.githubusercontent.com"
      - "objects.githubusercontent.com"
    # 单次网络下载数据量上限（如 pip / curl / git 等单次拉取，需 < 1G）
    max_download_size: "900m"

# 通过 help 工具披露给 LLM 的团队规模与资源限制。
# path 指向其他配置段的字段（点号分隔），help 返回时动态读取该字段的值，
# 因此只在此处维护"要披露哪些项"，数值始终来源于 agents/docker 等配置，避免重复。
help_policy:
  - name: "每个用户最多可创建的顶层 agent 数"
    path: "agents.max_per_user"
  - name: "团队最大层级深度（顶部 agent 为 Level 0）"
    path: "agents.max_level"
  - name: "每个 agent 最多指挥的成员数"
    path: "docker.max_members_per_level"
  - name: "每个沙箱 CPU 限制"
    path: "docker.resource_limits.cpu"
  - name: "每个沙箱内存限制"
    path: "docker.resource_limits.memory"
  - name: "每个沙箱磁盘限制"
    path: "docker.resource_limits.disk"
  - name: "单个文件上传大小上限"
    path: "upload.max_file_size"
  - name: "沙箱内全部文件总大小上限"
    path: "upload.sandbox_max_size"
  - name: "单次网络下载数据量上限"
    path: "sandbox.network.max_download_size"

wechat:
  app_id: ""
  app_secret: ""
  redirect_uri: ""

jwt:
  secret: "change-me-in-production"
  algorithm: "HS256"
  expire_hours: 72
