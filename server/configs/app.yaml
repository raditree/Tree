server:
  host: "0.0.0.0"
  port: 8000

# CORS 跨域配置。
# allow_origins 为空列表表示不放开任意源（默认，安全推荐）；
# 需要 Web 端跨域访问时，把允许的源列出来（如 ["http://localhost:3000"]）并置 allow_credentials: true。
# 注意：allow_credentials 为 true 时不允许出现 "*"，任意源带凭据是不安全组合。
cors:
  allow_origins: []
  allow_credentials: false

# 提示词体系多版本选择（见 server/prompt/versions.py；版本内容在 server/prompt/versions/ 下）
prompt:
  version: "1.0.0"

# 用户可创建的顶层 agent 数量上限
# 注：团队规模（最大层级深度 / 每层成员上限）不再在此配置——由用户创建
# TOP agent 时指定（见 data/team_store 的 teams 表 max_level /
# max_members_per_level），创建后不可修改，成员只增不减。
agents:
  max_per_user: 5

docker:
  image: "agent-workspace:latest"
  resource_limits:
    cpu: "4.0"
    memory: "4g"
    disk: "10g"

# 文件上传限制
upload:
  # 单个文件大小上限
  max_file_size: "300m"
  # 沙箱内全部文件总大小上限（上传前校验，避免单 agent 工作空间膨胀）
  sandbox_max_size: "8g"

# LLM 调用行为（应用级默认值）
llm:
  # 单次调用超时（秒）。长上下文 + thinking 模型响应可能很慢，
  # 但必须设上限，否则 API 挂起会导致前端永远显示 working（表现为卡死）
  timeout_seconds: 300
  # 调用失败重试次数
  max_retries: 1
  # 主动延迟限流（帧率控制式固定时间步节奏）：见 llm/rate_limit.py
  # 平均每 API 调用次数 / 分钟（限制上游调用频率，默认 6）
  rate_per_minute: 6
  # 最小调用间隔（秒），0 时自动按 60/rate_per_minute 推导（默认 10s）
  min_interval_seconds: 0

# SFT 数据收集与导出
data_export:
  # 每日自动导出时刻（HH:MM，本地时区；默认 1:43）
  daily_time: "01:43"
  # 上下文归档（agent_context_archive）保留天数：超过保留期的归档行由后台
  # 维护任务定期清理，防止 300+ agent 长跑下数据库无限膨胀；0 表示不清理
  archive_retention_days: 30
  # 允许下载/查看 SFT 导出文件的管理员 openid 列表
  # （导出文件含全量对话，仅管理员可访问，防止普通用户越权拉取）
  admin_openids: []

# 沙箱网络与下载限制（checklist 13/14）
sandbox:
  network:
    # 是否启用沙箱网络策略（出站代理：单次下载量上限 + 访问日志）。
    # - whitelist 为空（默认）：放开出站域名，沙箱可自由访问公网，仅保留
    #   单次下载量上限与访问日志（3128 出站代理）；容器以非 root + 最小能力集运行。
    # - whitelist 非空：恢复白名单式出站（仅放行列出的主机 80/443），
    #   此时容器以 root + NET_ADMIN 运行以配置 iptables。
    enabled: true
    # 白名单：放开模式留空 []；如需恢复白名单式出站，在此列出允许的
    # 域名/通配符（如 "*.pypi.org"）。默认放行回环、DNS 与已建立连接。
    whitelist: []
    # 单次网络下载数据量上限（如 pip / curl / git 等单次拉取，需 < 1G）
    max_download_size: "900m"

# 通过 help 工具披露给 LLM 的团队规模与资源限制。
# path 指向其他配置段的字段（点号分隔），help 返回时动态读取该字段的值，
# 因此只在此处维护"要披露哪些项"，数值始终来源于 agents/docker 等配置，避免重复。
help_policy:
  # 每个用户最多可创建的顶层 agent 数。
  # 注：max_per_user=-1/0/缺省时不限，实际运营上限为按用户等级控制的并发 agent 数
  # （见 registration.levels.*.max_concurrent_agents，动态披露后续实现）；此处保留静态路径兜底即可。
  - name: "每个用户最多可创建的顶层 agent 数"
    path: "agents.max_per_user"
  - name: "每个沙箱 CPU 限制"
    path: "docker.resource_limits.cpu"
  - name: "每个沙箱内存限制"
    path: "docker.resource_limits.memory"
  - name: "每个沙箱磁盘限制"
    path: "docker.resource_limits.disk"
  - name: "单个文件上传大小上限"
    path: "upload.max_file_size"
  - name: "沙箱内全部文件总大小上限"
    path: "upload.sandbox_max_size"
  - name: "单次网络下载数据量上限"
    path: "sandbox.network.max_download_size"

wechat:
  app_id: ""
  app_secret: ""
  redirect_uri: ""

jwt:
  # secret 留空时，后端启动后随机生成并仅存内存（进程内），不落盘——
  # 数据无硬编码泄露风险；副作用：进程重启后所有已签发 token 失效，需重新登录。
  # 如需跨重启保持登录态（多实例 / 容器重建），可在此配置固定值。
  secret: ""
  algorithm: "HS256"
  expire_hours: 72

# 用户注册与等级（registration）配置。
# 各字段含义：
#   - enabled                 ：是否开放注册
#   - restore_level           ：是否允许等级恢复（默认关闭）
#   - key_dir                 ：邀请码 .key 文件目录（留空 = server/ 目录）
#   - levels.<level>          ：各等级配额（common/pro/ultra/beta），字段含义如下：
#       - max_users              ：该等级最大可注册用户数（注册 + 升级均计入）
#       - validity_minutes       ：邀请码有效期（分钟）
#       - cooldown_minutes       ：邀请码到期后的冷却时间（分钟，>0 时冷却结束才重新生成）
#       - max_concurrent_agents  ：该等级用户可同时运行的并发 agent 数（等级只管并发；
#                                  团队规模在创建 TOP agent 时设定，见 config/team.py）
#       - rate_per_minute        ：常规速率限制（次/分钟）
#       - active_rate_per_minute ：活跃态速率限制（次/分钟）
registration:
  enabled: true
  restore_level: false
  key_dir: ""
  levels:
    common:
      max_users: 200
      validity_minutes: 1440
      cooldown_minutes: 0
      max_concurrent_agents: 4
      rate_per_minute: 12
      active_rate_per_minute: 6
    pro:
      max_users: 50
      validity_minutes: 360
      cooldown_minutes: 0
      max_concurrent_agents: 12
      rate_per_minute: 24
      active_rate_per_minute: 6
    ultra:
      max_users: 10
      validity_minutes: 30
      cooldown_minutes: 0
      max_concurrent_agents: 72
      rate_per_minute: 60
      active_rate_per_minute: 6
    beta:
      max_users: 1
      validity_minutes: 2
      cooldown_minutes: 18
      max_concurrent_agents: 500
      rate_per_minute: 300
      active_rate_per_minute: 6
