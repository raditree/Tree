# 模型配置示例模板
#
# 后端启动时扫描 server/configs/models/ 下每个 `.yaml` 文件作为一个模型。
# 注意：*.yaml 已在 .gitignore 中忽略（含 api_key 密钥），请复制本文件为
# 实际配置文件（如 my-model.yaml）并填写真实参数。
#
# 必填字段：
#   name                模型显示名称（前端展示用）
#   base_url            OpenAI 协议兼容的 API 地址
#   api_key             API 密钥
#   model_id            模型唯一标识（用于区分不同配置，同时也作为 API 请求的模型名，
#                        除非同时设置了 api_model_id）
#   api_model_id        可选。实际发送给 API 的模型名，不设置时默认使用 model_id。
#                       适用于多个配置使用同一模型名但指向不同 API 地址的场景。
#
# 可选字段（按模型需要）：
#   max_seqlen          最大上下文长度（普通 LLM 触发压缩的参考值）
#   temperature         采样温度
#   top_k               采样 top_k
#   thinking            是否启用思考模式（true/false，默认 false）
#   if_vision           是否支持图像输入（true/false，默认 false）。
#                       为 true 时 read 工具读图会构造 OpenAI vision 消息格式。
#   reasoning_effort    推理强度默认档位。下发前会归一化（去空白 + 转小写 +
#                       别名折叠 minimal→low / medium→high / xhigh→high /
#                       ultra→max），枚举外取值不会下发（回退模型自身默认）。
#                       也可在右栏「模型信息」里按 Agent 覆盖。
#   reasoning_effort_options
#                       可选。该模型**实际可选**的思考强度档位列表，供前端下拉与
#                       后端校验使用（纯声明字段，不下发给 API）。
#                       不声明时回退全局有区分度的档位：low / high / max。
#                       —— 为什么不直接用"端点接受的枚举"？
#                       各 OpenAI 兼容端点接受的枚举是语法层全集
#                       （DeepSeek: none/minimal/low/medium/high/xhigh/ultra/max），
#                       但多个取值在服务端被映射到同一档，摆进下拉就是选起来无差别
#                       的假选项（实测 DeepSeek 只有 low/high/max 三档真正不同）。
#                       若端点提供 GET /models 且返回 effort.supported_levels，
#                       可直接照抄该列表。
#   max_output_tokens   最大输出 token 数（显式下发 OpenAI 的 max_tokens）。
#                       注意与 max_seqlen 区分：后者是上下文预算，不下发给 API。
#   compress_threshold  上下文压缩触发阈值（0.1~0.95，占 max_seqlen 的比例，默认 0.8）。
#                       越小越早压缩；可按 Agent 覆盖。
#   top_p               采样 top_p
#   extra_body          额外请求体（如 thinking 配置）
#   timeout_seconds     单次请求超时（秒）。缺省回退 app.yaml llm.timeout_seconds
#                       （默认 300）。本地大上下文模型 prefill 可能长达 20 分钟
#                       以上：流式按 chunk 重置超时，但首 token 前的 prefill 仍
#                       受 read 超时约束——务必按需调大（如 1800~2400），
#                       否则长上下文请求会被超时打断。
#   max_retries         SDK 重试次数。缺省回退 app.yaml llm.max_retries（默认 1）。
#
# 提示：本目录下的 *.yaml 已在 .gitignore 中忽略（含 api_key 密钥）。
# 「设置 - 自定义模型」新增的模型也写入本目录，同样不会入 Git。

name: "示例模型"
base_url: "https://api.example.com/v1"
api_key: "sk-xxxx"
model_id: "example-model"
if_vision: false
max_seqlen: 65536
temperature: 0.7
top_k: 40
# 思考强度：默认档位 + 该模型可选档位（按端点实际映射能力填）
# reasoning_effort: high
# reasoning_effort_options: [low, high, max]
# 本地模型示例：长上下文 prefill 较慢时取消注释并调大超时
# timeout_seconds: 1800
# max_retries: 0