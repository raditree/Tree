# 模型配置示例模板
#
# 后端启动时扫描 server/configs/models/ 下每个 `.yaml` 文件作为一个模型。
# 注意：*.yaml 已在 .gitignore 中忽略（含 api_key 密钥），请复制本文件为
# 实际配置文件（如 my-model.yaml）并填写真实参数。
#
# 必填字段：
#   name                模型显示名称（前端展示用）
#   base_url            OpenAI 协议兼容的 API 地址
#   api_key             API 密钥
#   model_id            模型唯一标识（用于区分不同配置，同时也作为 API 请求的模型名，
#                        除非同时设置了 api_model_id）
#   api_model_id        可选。实际发送给 API 的模型名，不设置时默认使用 model_id。
#                       适用于多个配置使用同一模型名但指向不同 API 地址的场景。
#
# 可选字段（按模型需要）：
#   max_seqlen          最大上下文长度（普通 LLM 触发压缩的参考值）
#   temperature         采样温度
#   top_k               采样 top_k
#   thinking            是否启用思考模式（true/false，默认 false）
#   reasoning_effort    推理强度
#   extra_body          额外请求体（如 thinking 配置）

name: "示例模型"
base_url: "https://api.example.com/v1"
api_key: "sk-xxxx"
model_id: "example-model"
max_seqlen: 65536
temperature: 0.7
top_k: 40