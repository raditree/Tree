# MCP 工具描述（v1.0.0，单一事实来源）
# 文档工具（document_server.build_server 引用的工具规格）
# embed_search 分两分支：embed（已配置嵌入模型，向量语义搜索）/ grep（grep 降级）
read_pdf:
  version: 2
  description: |
    [解析 PDF：章节目录/按章节阅读/全文] | 贡献维度: 外部能力/文档处理
    何时使用: 需要读取 .pdf 文件时——先用默认 mode=toc 取章节目录，再按章节取正文（支持中文标题与中文路径）
    何时不用: 非 PDF 文档用 read_docx/read_pptx/read_xlsx；目录已明确且需全部内容时用 mode=text
    前置依赖: 文件须存在于工作空间且为 PDF；中文书签标题/中文路径均受支持
    参数说明:
      - mode=toc（默认）：仅返回文档信息与章节目录（每项含序号/标题/页码），不返回正文
      - mode=chapters + chapters：按章节直接返回正文，支持一次多个章节（chapters=1,3-5 或 1-3；也支持标题关键词如 第一章；无书签时可用 p:5-8 指定页码范围）
      - mode=text：按页返回全文（兼容旧行为），可用 pages=3-8 限定页范围
      - max_chars：正文返回最大字符数（默认 8000），超出部分截断并在结果中标记 truncated/message

read_docx:
  version: 1
  description: |
    [解析 DOCX 提取文本与表格] | 贡献维度: 外部能力/文档处理
    何时使用: 需要读取 .docx 文件内容（段落文本与表格数据）
    何时不用: 非 DOCX 文档用对应的 read_* 工具
    前置依赖: 文件须存在于工作空间且为 DOCX

read_pptx:
  version: 1
  description: |
    [解析 PPTX 提取幻灯片文本] | 贡献维度: 外部能力/文档处理
    何时使用: 需要读取 .pptx 文件内容（所有幻灯片的文本）
    何时不用: 非 PPTX 文档用对应的 read_* 工具
    前置依赖: 文件须存在于工作空间且为 PPTX

read_xlsx:
  version: 1
  description: |
    [解析 XLSX 提取工作表数据] | 贡献维度: 外部能力/文档处理
    何时使用: 需要读取 .xlsx 文件内容（各工作表数据）
    何时不用: 非 XLSX 文档用对应的 read_* 工具
    前置依赖: 文件须存在于工作空间且为 XLSX

create_docx:
  version: 1
  description: |
    [由文本生成 DOCX 文档] | 贡献维度: 外部能力/文档产出
    何时使用: 需要产出 .docx 文件（按文本内容，多行用 \n 分隔）
    何时不用: 产出非 DOCX 用对应的 create_* 工具
    前置依赖: 保存路径可写；内容按工具约定的文本格式传入

create_pptx:
  version: 1
  description: |
    [由 JSON 生成 PPTX 幻灯片] | 贡献维度: 外部能力/文档产出
    何时使用: 需要产出 .pptx 文件（按 JSON 描述的标题/内容生成）
    何时不用: 产出非 PPTX 用对应的 create_* 工具
    前置依赖: 保存路径可写；slides 为合法 JSON 数组字符串

create_xlsx:
  version: 1
  description: |
    [由 JSON 数据生成 XLSX] | 贡献维度: 外部能力/文档产出
    何时使用: 需要产出 .xlsx 文件（按 JSON 工作表数据生成）
    何时不用: 产出非 XLSX 用对应的 create_* 工具
    前置依赖: 保存路径可写；data 为合法 JSON 对象字符串

embed_search.embed:
  version: 1
  description: |
    [工作空间全文语义搜索] | 贡献维度: 上下文获取
    何时使用: 需要按语义（而非仅关键词）在工作空间内检索最相关内容；关键词不确定、想要『意思相近』的结果时
    何时不用: 已明确文件路径时用 read；仅需精确关键词定位可先用 grep
    前置依赖: 已配置嵌入模型；query 不能为空

embed_search.grep:
  version: 1
  description: |
    [工作空间文本搜索（grep 降级）] | 贡献维度: 上下文获取
    何时使用: 需要按关键词在工作空间内定位内容
    何时不用: 已明确文件路径时用 read
    前置依赖: 配置嵌入模型后升级为向量语义搜索