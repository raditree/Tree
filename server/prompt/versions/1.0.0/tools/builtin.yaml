# 系统内置工具描述（v1.0.0，单一事实来源；tool/*.py 的 get_tool_definition 引用之）
# 结构化模板：title | 贡献维度 + 何时使用/何时不用/前置依赖/动作
read:
  version: 2
  description: |
    [读取工作空间文件内容] | 贡献维度: 上下文获取（获取文件/代码/配置现状，是所有修改与判断的前提）
    何时使用: 修改任何文件前必须先 read 看清楚当前内容；查找代码/配置/文档内容；排查问题时读取相关文件；读取图像文件（png/jpg/jpeg/webp/gif，自动识别并返回 base64）
    何时不用: 已确定文件内容无需重读；大目录浏览用 Terminal ls
    前置依赖: 文件必须存在于工作空间；file_path 必须为工作空间内相对路径（如 lib/foo.dart），禁止绝对路径或盘符（如 E:\foo.dart、E:/foo.dart 会被拒绝）
    省钱技巧: `read` 时设置 start_line/line_count ，只读需要的行为表/函数，避免整文件全读占用大量上下文

write:
  version: 2
  description: |
    [向工作空间写入文件，自动创建父目录] | 贡献维度: 文件产出（创建新文件/脚本/文档/配置文件）
    何时使用: 新建文件（如新模块、新脚本、新文档、配置文件）；整文件重写（WriteFile 覆盖）；生成批量内容
    何时不用: 已有文件的小改动（用 edit 保留上下文）；创建目录/删除文件用 Terminal
    前置依赖: 工作空间可写；file_path 必须为工作空间内相对路径（如 lib/foo.dart），禁止绝对路径或盘符（如 E:\foo.dart、E:/foo.dart 会被拒绝）；写入前建议先 read 确认是否已有同名文件

grep:
  version: 3
  description: |
    [在工作空间内按模式搜索文件内容] | 贡献维度: 上下文获取（快速定位关键字/正则出现的位置，先定位再精读）
    何时使用: 需要在工作空间内查找某关键字/标识符/配置项出现的位置；用正则批量定位模式（如 TODO|FIXME、函数调用点）；不确定目标文件时先 grep 缩小范围再 read 精读
    何时不用: 已确定目标文件时直接 read；需要语义/向量检索用 embed_search（内置工作空间 MCP 工具，已直接注入为 mcp__workspace__embed_search）；浏览目录结构用 Terminal ls
    前置依赖: pattern 必填；regex=false 时 pattern 为字面量、regex=true 时为正则；path 可限定搜索范围（工作空间内相对路径）；ignore_case 控制大小写；max_depth 限制递归层数（1=仅目标目录本层、缺省 0 不限）；exclude 在默认排除之外追加排除项，逗号分隔 glob，仅按名称（basename）匹配、支持 * 与 ?（如 '*.g.dart,*.min.js'，不接受 lib/*.dart 这类带路径的模式，会直接报错）
    默认排除: .git 与依赖/缓存/构建产物目录（.venv、venv、node_modules、.pub-cache、.dart_tool、build、dist、__pycache__、.mypy_cache、.pytest_cache、.ruff_cache、.tox）默认不搜；确实要搜这些目录时显式把 path 指过去（如 path='.venv' 或 '.venv/lib'），该目录即不再被排除
    省钱技巧: 用 path 缩小搜索范围、用 max_depth/exclude 裁剪无关子树（如排除 *.min.js）、用 max_results 限制返回行数（缺省 200），避免大海捞针占用上下文

edit:
  version: 3
  description: |
    [对工作空间文件执行精确字符串替换] | 贡献维度: 文件产出（对已有文件做局部精准修改，保留其余内容）
    何时使用: 修改已有文件的某段内容（改逻辑/文案/参数）；old_text 必须在文件中唯一匹配，否则返回错误；自动兼容 LF/CRLF 换行文件（无需手动转换）
    何时不用: 新建文件用 write；大段重写用 write 覆盖；不确定匹配内容时先 read 确认
    前置依赖: 文件已存在；file_path 必须为工作空间内相对路径（如 lib/foo.dart），禁止绝对路径或盘符（如 E:\foo.dart、E:/foo.dart 会被拒绝）；编辑前应先 read 拿到准确的 old_text

terminal:
  version: 2
  description: |
    [在工作空间执行 shell 命令（含 git）] | 贡献维度: 环境执行（运行构建/测试/安装/文件操作，验证与运维的唯一途径）
    何时使用: 运行构建与测试（验证改动）；安装依赖；git 操作；文件/目录管理（ls/mkdir/rm）；运行脚本；查看环境
    何时不用: 读/写/改文件内容用 read/write/edit（更精确、可追溯）；仅需内容查看时避免用 cat 取代 read
    前置依赖: 命令须符合当前执行环境的 shell 语法（cloud=sh；local Windows=cmd.exe；ssh=远端 shell，见 system prompt）
    输出捕获: hook 模式与普通模式下 stdout/stderr 都会被工具自动捕获并返回，命令中无需追加 2>&1（hook 模式还会把错误输出重定向到 output_file 日志，追加 2>&1 属冗余，且可能干扰 Windows 管道行为）
    长任务（hook 模式）: 对构建/测试/长脚本等预计很长的命令，传 hook=true 以后台模式执行——输出实时重定向到
      output_file（工作空间相对路径，缺省自动派生 .output/hook_<id>.log），工具立即返回 task_id 不阻塞本
      轮；命令结束后会自动收到 [terminal hook] 提示（含退出码与输出文件），届时用 read 工具读取该文件继续
      任务。运行期间可用 read 工具 tail 查看实时进度；用 hook_action=status/cancel + task_id 查询/取消后台任务。

mcp:
  version: 2
  description: |
    [MCP 服务发现与兜底调用] | 贡献维度: 外部能力（接入工作空间以外的第三方能力：文档解析、网页检索、数据库、外部 API 等）
    何时使用: 查看当前可用的 MCP 工具清单（help）；调用未直接注入可用工具列表的 MCP 工具（call）
    何时不用: 文档解析（read_pdf/read_docx/read_pptx/read_xlsx/create_*）与语义检索（embed_search）等内置 MCP 工具已按 mcp__<服务名>__<工具名> 直接注入可用工具，直接调用即可，无需经本工具；工作空间内的文件读写/执行用 read/write/edit/terminal
    前置依赖: 内置服务（workspace/document）的工具在会话创建时已完成发现并注入；外部服务的工具清单需先用 help 查询，再以 action=call、tool_name=mcp__<服务名>__<工具名> 调用
    注意: 区分 mcp 与内置工具职责；工具名遵循 mcp__<服务名>__<工具名> 命名空间

team:
  version: 5
  description: |
    [团队协作-管理域：成员与团队信息管理] | 贡献维度: 协同（建队、成员档案、分工与状态查询）
    何时使用: 查看本用户名下团队（list_teams）；查看本团队名单与拓扑（list_members）；应用户自然语言要求创建成员（create_member，仅限 team leader）；应用户明确要求移除/裁撤成员（remove_member，仅限 team leader，默认连同其下级子树一并移除）；查询/调整成员档案（query_member / update_member：role 角色、duty 职责、can_lead_team 能否带队）；应用户明确要求放行/驳回成员（review_member）；查询成员实时工作状态与日志路径（query_status）
    何时不用: 发消息/派活/等待完成请用 message 工具；简单任务（easy）无需团队；仅需给自己排进度用 set_todo_list。create_member/remove_member/review_member 都是**破坏性或权限性**动作，未经用户明确要求不要调用
    前置依赖: 成员已预建（TOP 创建时建队 3 名）或由 leader 经 create_member 扩充；按 name 或 member id 寻址；分工前先 list_members 确认拓扑；成员职责未设时先 update_member 设置；remove_member 前先 list_members 确认目标及其下级
    模型边界（重要）: 本工具**不提供任何模型能力**——没有 list_models（模型池）动作，create_member/update_member/review_member 也**不接受 model_id 参数**（传入即报错）。成员的模型一律由**用户本人**在「团队成员 → 模型配置」页亲自选择，你无权查看模型池、无权指定、无权修改；需要变更模型时只提示用户去该页操作
    成员就绪（重要）: 新成员**不继承 TOP 模型**，model_id 留空、review_status=pending_model，**在用户赋模型并审核通过前不接收也不执行任何消息**。赋模型与审核都是**用户的界面操作**（「团队成员 → 模型配置」页），你无权替代；list_members 返回 not_ready_count 与 hint 标出未就绪成员，看到它们时应当**提示用户去配置**，而不是反复 send_message 派活（必被拒绝）。review_member 仅在用户明确指示时使用
    注意: remove_member 只能移除自己的直属/下级成员，不可移除自身或任何上级；目标仍有下级时须显式 cascade=true（否则拒绝，避免留下孤儿成员）；移除会连带清理该成员的工作空间、会话上下文与运行时注册，磁盘数据保留供审计，操作不可撤销。role/duty 为空时先 update_member 补充；update_member/remove_member/review_member 必须携带 target_member_id（或 member_name），先从 list_members 获取，禁止省略
    验收产出: 统一工作目录下可直接 read 成员日志 agentspace/{member_id}/.self/activity.log（带日期时间戳，可检索 [done]/[tool] 等标记）及其工作目录内文件，不存在"查看产出"类 action；query_status 只返回实时工作状态、最后活动时间与日志路径；remove_member 返回 removed_ids/subtree_removed/persisted/roster_pushed；review_member 返回 review_status 与是否已可工作
message:
  version: 3
  description: |
    [团队协作-通信域：消息派发、广播、等待完成] | 贡献维度: 协同（向成员派活、点对点沟通、直属广播、等待交付）
    何时使用: 向成员派活或沟通（send_message：消息中写清工作内容、预期产出与完成后回复要求）；向自己的直属 leader 汇报（target_member_id 传 leader）；TOP 之间跨团队协作（先 list_teams，仅 TOP 自己可发起）；向全体**直属成员**广播（broadcast，不跨层级）；等待成员完成当前工作（wait_for）
    何时不用: 建队/改成员档案/移除成员用 team 工具（模型配置是用户在界面上的操作，不是工具能力）；简单任务（easy）无需团队；仅需给自己排进度用 set_todo_list
    前置依赖: 先 list_members/list_teams 获取确切 ID/名称；broadcast 仅发给 parent 为本 agent 的直属成员（无直属时返回 no_recipients，不会伪装成功）；send_message 支持一对多（target_ids），返回逐目标 sent/rejected/unknown 明细
    发送文件: send_message 的 files 接受**本 agent 工作空间内**的相对路径列表（如 ['out/report.md']），系统把它复制到接收方工作空间 .input/<日期>/（可用 dest_dir 改目标目录），接收方用 read 即可打开；正文会自动附上送达路径，无需手写。同 team 成员之间在共享目录内直接复制（不经过后端、不受大小限制）；跨 TOP 时由后端中转，单文件上限 32MB，超限请改用共享目录或文件面板
    回复机制（重要）: **系统不会替你回传任何总结**——收到消息后如需让对方知道结果，必须自己用 send_message 回发。何时必须回发：交付了对方要的产出、被明确要求回复、发现阻塞或需要对方决策。何时禁止回发：仅为确认收到、寒暄、复述对方原话、无新增信息——**不要与同一对象连续互发无实质内容的消息**，否则两个 agent 会陷入 A→B→A… 的无限交火循环并烧掉大量 API 调用
    wait_for 语义: 目标必须先被观测到 working 再转 idle 才算 completed；启动宽限内从未工作的成员标 never_started（可能未接单或已瞬间完成，须 send_message 确认或 read 其 agentspace/{member_id}/.self/activity.log 核实，禁止假定完成）；超时后可结束本轮，对方主动回发的消息会唤醒你
    任务范式: 不存在任务类 action——派活即 send_message；你自行用 set_todo_list 跟踪派发事项；成员产出落在统一工作目录，验收以 read activity.log 与工作目录产出为准（不依赖任何自动总结回传）

set_todo_list:
  version: 1
  description: |
    [任务分解与进度跟踪] | 贡献维度: 任务管理（把任务拆成可跟踪的 todo 列表，持续汇报进度）
    何时使用: 开始复杂任务前先 set 分解；执行中每完成/推进一项、遇到阻塞都要立即用 update 增量更新（status/progress），不得攒到全部完成才统一标注
    何时不用: 简单单文件改动（easy 任务）无需 todo
    前置依赖: 工作空间可写（.self/todos.md）
    动作: set(整体替换) / update(按 id 更新) / clear(清空) / get(读取快照)

ask_user_question:
  version: 1
  description: |
    [向用户提问] | 贡献维度: 人机协作（获取用户决策/澄清/补充信息，消除歧义与风险）
    何时使用: 任务信息不完整需要澄清；需要用户决策/选择；高风险操作（删除/覆盖/破坏性/花钱）需确认；多方案让用户选型
    何时不用: 可从现有上下文/文件推断时不提问；琐碎问题自己能决策时不要打断用户；hard 任务之外避免频繁提问
    前置依赖: 用户在线（WebSocket 连接）可收到问题卡片；options 提供后用户可快速选择，否则自由输入。提问后 agent 会暂停等待，用户作答后自动继续

spec:
  version: 1
  description: |
    [任务型规范（Spec）检索/选择/沉淀] | 贡献维度: 任务管理（把任务经验沉淀为可复用规范，指导后续任务） + 上下文获取（检索/读取历史任务规范）
    何时使用: 任务开始前检索是否已有对应 Spec；任务完成前沉淀新 Spec；用户/本会话已选 Spec 需读全文时
    何时不用: 无。**必须调用**，即使单文件修改也必须先 **read 并 select** easy spec 再开始任务
    前置依赖: 在搜索更多 spec 前必须先从四个内置基础 spec 中选择一个或多个
    动作: search(语义检索) / list(索引) / read(全文) / select(多选挂 hook) / create(创建) / update(更新)