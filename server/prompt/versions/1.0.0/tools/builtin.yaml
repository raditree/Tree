# 系统内置工具描述（v1.0.0，单一事实来源；tool/*.py 的 get_tool_definition 引用之）
# 结构化模板：title | 贡献维度 + 何时使用/何时不用/前置依赖/动作
read:
  version: 1
  description: |
    [读取工作空间文件内容] | 贡献维度: 上下文获取（获取文件/代码/配置现状，是所有修改与判断的前提）
    何时使用: 修改任何文件前必须先 read 看清楚当前内容；查找代码/配置/文档内容；排查问题时读取相关文件；读取图像文件（png/jpg/jpeg/webp/gif，自动识别并返回 base64）
    何时不用: 已确定文件内容无需重读；大目录浏览用 Terminal ls
    前置依赖: 文件必须存在于工作空间
    省钱技巧: 大文件用 start_line/line_count 只读需要的行为表/函数，避免整文件全读占用大量上下文

write:
  version: 1
  description: |
    [向工作空间写入文件，自动创建父目录] | 贡献维度: 文件产出（创建新文件/脚本/文档/配置文件）
    何时使用: 新建文件（如新模块、新脚本、新文档、配置文件）；整文件重写（WriteFile 覆盖）；生成批量内容
    何时不用: 已有文件的小改动（用 edit 保留上下文）；创建目录/删除文件用 Terminal
    前置依赖: 工作空间可写；写入前建议先 read 确认是否已有同名文件

edit:
  version: 1
  description: |
    [对工作空间文件执行精确字符串替换] | 贡献维度: 文件产出（对已有文件做局部精准修改，保留其余内容）
    何时使用: 修改已有文件的某段内容（改逻辑/文案/参数）；old_text 必须在文件中唯一匹配，否则返回错误
    何时不用: 新建文件用 write；大段重写用 write 覆盖；不确定匹配内容时先 read 确认
    前置依赖: 文件已存在；编辑前应先 read 拿到准确的 old_text

terminal:
  version: 1
  description: |
    [在工作空间执行 shell 命令（含 git）] | 贡献维度: 环境执行（运行构建/测试/安装/文件操作，验证与运维的唯一途径）
    何时使用: 运行构建与测试（验证改动）；安装依赖；git 操作；文件/目录管理（ls/mkdir/rm）；运行脚本；查看环境
    何时不用: 读/写/改文件内容用 read/write/edit（更精确、可追溯）；仅需内容查看时避免用 cat 取代 read
    前置依赖: 命令须符合当前执行环境的 shell 语法（cloud=sh；local Windows=cmd.exe；ssh=远端 shell，见 system prompt）

mcp:
  version: 1
  description: |
    [调用外部 MCP 能力（文档解析/搜索/第三方服务）] | 贡献维度: 外部能力（接入工作空间以外的第三方能力：文档解析、网页检索、数据库、外部 API 等）
    何时使用: 需要解析 PDF/PPTX/DOCX/XLSX 等文档；需要外部搜索/第三方服务；任务需要工作空间外的数据与能力
    何时不用: 工作空间内的文件读写/执行用 read/write/edit/terminal；不需外部能力时不要调用
    前置依赖: 先 help 查看可用 MCP 工具；注意区分 mcp 与内置工具职责

team:
  version: 1
  description: |
    [团队协作：成员管理/消息/任务调度] | 贡献维度: 协同（与团队成员协作：分工、通信、任务指派、进度跟踪）
    何时使用: 复杂任务需分工协作时（update_member 设分工 + assign_task 指派）；与同级/下级成员通信；跨 Top agent 顶层协作（需用户透露对方 TOP name，先 list_teams 熟悉本用户名下 TOP）；查看成员产出/日志/状态
    何时不用: 简单任务（easy）无需团队；仅需给自己排进度用 set_todo_list 而非 team
    前置依赖: 成员已预建（TOP 创建时全量建队），按 name 或 member id 寻址；分工前先 list_members 确认拓扑；成员职责未设时先 update_member 设置
    注意: 成员不可动态创建/删除（P4 预建）；仅可 update_member 调整。修改成员信息会触发名单推送
    **使用前可查成员基本信息**：先 list_members / query_member 查看成员的 role（角色）、duty（职责）、model_id（模型）；role/duty 为空时用 update_member 补充完善再派发任务；model_id 为空会自动回退所属 TOP 模型，无需强制设置。
    update_member 必须携带 target_member_id（或 member_name）指定目标成员，先从 list_members 获取成员 id/name，禁止省略

set_todo_list:
  version: 1
  description: |
    [任务分解与进度跟踪] | 贡献维度: 任务管理（把任务拆成可跟踪的 todo 列表，持续汇报进度）
    何时使用: 开始复杂任务前先 set 分解；执行中每完成/推进一项、遇到阻塞都要立即用 update 增量更新（status/progress），不得攒到全部完成才统一标注
    何时不用: 简单单文件改动（easy 任务）无需 todo
    前置依赖: 工作空间可写（.self/todos.md）
    动作: set(整体替换) / update(按 id 更新) / clear(清空) / get(读取快照)

ask_user_question:
  version: 1
  description: |
    [向用户提问] | 贡献维度: 人机协作（获取用户决策/澄清/补充信息，消除歧义与风险）
    何时使用: 任务信息不完整需要澄清；需要用户决策/选择；高风险操作（删除/覆盖/破坏性/花钱）需确认；多方案让用户选型
    何时不用: 可从现有上下文/文件推断时不提问；琐碎问题自己能决策时不要打断用户；hard 任务之外避免频繁提问
    前置依赖: 用户在线（WebSocket 连接）可收到问题卡片；options 提供后用户可快速选择，否则自由输入。提问后 agent 会暂停等待，用户作答后自动继续

spec:
  version: 1
  description: |
    [任务型规范（Spec）检索/选择/沉淀] | 贡献维度: 任务管理（把任务经验沉淀为可复用规范，指导后续任务） + 上下文获取（检索/读取历史任务规范）
    何时使用: 任务开始前检索是否已有对应 Spec；任务完成前沉淀新 Spec；用户/本会话已选 Spec 需读全文时
    何时不用: 无。**必须调用**，即使单文件修改也必须先 **read 并 select** easy spec 再开始任务
    前置依赖: 在搜索更多 spec 前必须先从四个内置基础 spec 中选择一个或多个
    动作: search(语义检索) / list(索引) / read(全文) / select(多选挂 hook) / create(创建) / update(更新)