name: tree
description: Tree - LLM 驱动的 agent 团队桌面效率工具
# 防止意外发布到 pub.dev
publish_to: 'none'

# 应用版本号与构建号
version: 1.0.0+1

# desktop 分支：升级到 Dart 3（Flutter 3.47.5 / Dart 3.13.4），放弃 Windows 7/8（最低 Windows 10）
environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # iOS 风格图标
  cupertino_icons: ^1.0.9
  # WebSocket 通信（与后端实时消息）
  web_socket_channel: ^3.0.3
  # HTTP 请求（REST API 调用）
  http: ^1.6.0
  # 桌面文件拖拽
  desktop_drop: ^0.8.4
  # Markdown 渲染（模型输出默认 markdown 格式）
  # 原 flutter_markdown 已停止维护（pub 标记 discontinued），改用其官方继任 fork
  flutter_markdown_plus: ^1.0.12
  # SSH/SFTP 客户端（纯 Dart，Windows 桌面可用）；SSH 模式连接由前端发起，IP 相对前端机器
  dartssh2: ^4.1.0
  file_picker: ^13.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  # 跨平台路径拼接（定位/拼接核心进程可执行文件路径）
  path: ^1.9.0
  # 桌面分支：核心进程与应用共用的协议定义（握手信封 / REST 路径 / WS 帧类型）
  tree_protocol:
    path: packages/tree_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 代码规范 lint 规则集
  flutter_lints: ^6.0.0

# Flutter 相关配置
flutter:
  # 启用 Material Icons 字体
  uses-material-design: true
