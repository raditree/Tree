name: tree
description: Tree 桌面端发布工程（核心 / 引导壳 / 插件发布）。UI 源码已迁入插件仓 plugins/tree.ui.default。
# 防止意外发布到 pub.dev
publish_to: 'none'

# 安装包 / 核心 / loader 的版本（界面插件版本独立，取插件自己 pubspec.yaml 的 version）
version: 1.0.6+1

# desktop 分支：Dart 3（Flutter 3.47.5 / Dart 3.13.4），最低 Windows 10
environment:
  sdk: ^3.13.0

# 只留工具脚本真正 import 的包：`dart run tool/*.dart` 需要包解析上下文。
# 界面依赖不在这里——它们住在 plugins/tree.ui.default/pubspec.yaml。
dependencies:
  tree_protocol:
    path: packages/tree_protocol
